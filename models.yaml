# RealBio Benchmark — model roster (the systems actually on the leaderboard).
# Prices are published per-million-token rates; the frontier/open LLMs were run via OpenRouter,
# which adds a ~5% fee on top of these base rates (applied when computing $/item in the README).
#
# Each entry:
#   name        display name on the leaderboard
#   model       the API model id (as the provider expects it)
#   base_url    OpenAI-compatible endpoint (null = OpenAI native); OpenRouter serves the rest
#   key_env     env var holding that endpoint's API key
#   price_in    USD per 1M input tokens   (published provider / OpenRouter rate)
#   price_out   USD per 1M output tokens
#
# The driver (src/run_all.py) runs every model whose key_env is SET and skips the rest.

models:
  # ---- frontier (proprietary) ----
  - {name: GPT-5.6,        model: openai/gpt-5.6,                 base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, price_in: 2.00,  price_out: 10.00}
  - {name: GPT-5.6-luna,   model: openai/gpt-5.6-luna,            base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, price_in: 0.20,  price_out: 1.20}
  - {name: Claude Opus 5,  model: anthropic/claude-opus-5,        base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, price_in: 5.00,  price_out: 25.00}
  - {name: Gemini 3.1 Pro, model: google/gemini-3.1-pro-preview,  base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, price_in: 1.25,  price_out: 5.00}

  # ---- open weight ----
  - {name: Kimi K3,        model: moonshotai/kimi-k3,             base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, price_in: 3.00,  price_out: 15.00}
  - {name: Qwen3.8-Max,    model: qwen/qwen3.8-max,               base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, price_in: 2.00,  price_out: 6.00}
  - {name: DeepSeek V4,    model: deepseek/deepseek-v4-pro,       base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, price_in: 1.12,  price_out: 3.37}
  # GLM-5.2 was delisted from OpenRouter after the run; price shown is the closest live version, GLM-5.3.
  - {name: GLM-5.2,        model: z-ai/glm-5.2,                   base_url: https://openrouter.ai/api/v1, key_env: OPENROUTER_API_KEY, price_in: 1.40,  price_out: 4.40}

# Not driven by run_all.py (run as their own systems, listed on the leaderboard for comparison):
#   Biomni (A1)  — Stanford agent scaffold; engine = Claude Opus 5 (routing/param/protocol),
#                  Claude Sonnet 4.5 (PBPK/BOIN). Cost measured directly from its OpenRouter spend.
#   BioMate      — the product; a mixture of LLMs behind a curated catalog. Cost measured from its
#                  own usage meter (its dev instance served these via GPT-5.6-luna).
